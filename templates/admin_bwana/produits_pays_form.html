{% extends 'base.html' %}
{% block title %}{{ titre }} — Admin{% endblock %}
{% block page_title %}📦 {{ titre }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nom du pays <span class="text-danger">*</span></label>
                        <input type="text" name="nom" class="form-control" placeholder="Ex: Burkina Faso"
                               value="{{ pays.nom|default:'' }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Code ISO <span class="text-danger">*</span></label>
                            <input type="text" name="code" class="form-control" placeholder="Ex: BF" maxlength="10"
                                   value="{{ pays.code|default:'' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Devise <span class="text-danger">*</span></label>
                            <input type="text" name="devise" class="form-control" placeholder="Ex: XOF" maxlength="10"
                                   value="{{ pays.devise|default:'' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Symbole</label>
                            <input type="text" name="symbole_devise" class="form-control" placeholder="Ex: FCFA" maxlength="5"
                                   value="{{ pays.symbole_devise|default:'' }}">
                            <small class="text-muted">Laisser vide = même valeur que la devise</small>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-2"></i>{{ bouton }}
                        </button>
                        <a href="{% if pays %}{% url 'admin_produits_pays_detail' pays.pk %}{% else %}{% url 'admin_produits_pays_liste' %}{% endif %}"
                           class="btn btn-outline-secondary px-4">
                            Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
